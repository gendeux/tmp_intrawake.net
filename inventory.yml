# This is an example inventory file.
#
# Replace 'your_host' with a name for your target host,
# and '192.168.1.100' with its IP address.
#
# The 'ansible_user' is the user that Ansible will connect as.
# This user should have passwordless 'doas' configured to allow
# running commands as root.
#
# The 'ansible_ssh_private_key_file' should point to the private key
# for the 'ansible_user'.

all:
  hosts:
    your_host:
      ansible_host: 192.168.1.100
      # ansible_user: your_user
      # ansible_ssh_private_key_file: ~/.ssh/id_rsa
